name: Validate release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare workspace
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path .work | Out-Null
      - name: Install locked dependencies
        shell: pwsh
        env:
          PIP_CACHE_DIR: ${{ github.workspace }}/.work/pip-cache
          TEMP: ${{ github.workspace }}/.work
          TMP: ${{ github.workspace }}/.work
        run: |
          python -m pip install -r requirements-lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-build-isolation -e .
          exit $LASTEXITCODE
      - name: Check code and release gates
        shell: pwsh
        run: python scripts/check.py
      - name: Build local distributions
        shell: pwsh
        run: python scripts/build_release.py
